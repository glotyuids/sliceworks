# sliceworks 0.8.0: project defaults for the Codex runtime (dual profile), written by adopt to .codex/config.toml.
# Hooks come from the plugin (its hooks/hooks.json) or, for a copy install, from the .codex/hooks.json that
# scripts/install.sh --tools codex writes; never both, or every guard runs twice. Codex runs a plugin's hooks only
# after they are reviewed and trusted (/hooks in an interactive session); trust them once before the first dispatch.
# Role agents in .codex/agents are generated by scripts/runtimes/codex/agents.py sync; the T0 parity step is
# `agents.py check`. Implementers and reviewers run as worker processes (scripts/runtimes/codex/dispatch.sh), not
# as native subagents, so the thread cap below bounds only the read-only helpers of the coordinator's own session.
model = "<coordinator model>"
model_reasoning_effort = "high"

[agents]
default_subagent_model = "<subagent model>"
default_subagent_reasoning_effort = "high"
